name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pushes on a feature branch are cancelled; runs on `main` are never
# cancelled, so there is always a complete record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm is resolved from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also fails if pnpm-lock.yaml is out of sync with package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Catches build breaks on the PR, before Vercel ever builds `main`.
      # Needs no env: both N8N_* vars are read inside the server action body
      # (submit-contact.tsx:11-12), never at module scope, so the build does
      # not evaluate them.
      - name: Build
        run: pnpm build
